name: Smoke Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [vault, openbao]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/tests/webhook/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Init Docker Swarm
        run: docker swarm init

      - name: Run smoke test for ${{ matrix.provider }}
        run: bash scripts/tests/smoke-test-${{ matrix.provider }}.sh

  smoke-test-awssm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Init Docker Swarm
        run: docker swarm init

      # Floci is a lightweight open-source AWS emulator started by the smoke test
      # itself, so no LocalStack auth token / license is required. The aws CLI is
      # preinstalled on ubuntu-latest runners.
      - name: Run smoke test for awssm
        run: bash scripts/tests/smoke-test-awssm.sh
