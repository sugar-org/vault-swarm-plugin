name: AWS Floci Tests

on:
  pull_request:
  push:
    branches: [main, alpha/provider-integration]

jobs:
  aws-floci-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The floci native image ships no shell tools, so readiness is probed
      # from the runner via the LocalStack-compatible health endpoint.
      - name: Start Floci
        run: |
          docker compose -f scripts/tests/floci-compose.yml up -d
          elapsed=0
          until curl -sf http://localhost:4566/_localstack/health >/dev/null 2>&1; do
            sleep 2
            elapsed=$((elapsed + 2))
            if [[ "${elapsed}" -ge 30 ]]; then
              echo "Floci did not become healthy within 30s"
              docker compose -f scripts/tests/floci-compose.yml logs
              exit 1
            fi
          done
          echo "Floci is ready."

      - name: Run Floci tests
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_KMS_ENDPOINT: http://localhost:4566
        run: |
          go test ./providers/... ./internal/secrettransform/... -run Floci -count=1 -v
